name: quality gateway implementation
on:
  push:
    branches:
      - main 
jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code 
        uses: actions/checkout@v7
      - name: install required package
        run: pip install -r requirements.txt
      - name: run test case
        run: pytest --cov=calc --cov-report=term --cov-fail-under=80
      - name: print message 
        run: echo 'build completed'

  deploy-job:
    needs: build-job
    runs-on: ubuntu-latest
    steps:
      - name: print message
        run: echo 'deploy to production'